<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Profile search</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>GitHub Profile search</h1>
    <p>Cari profil GitHub menggunakan username</p>
  </header>

  <main class="container">
    <form id="searchForm" class="search-box">
      <label for="username">Username GitHub</label>
      <input id="username" type="text" placeholder="Contoh: octocat" autocomplete="off" required>
      <button id="searchButton" type="submit">Cari Profil</button>
    </form>

    <p id="status" role="status" aria-live="polite"></p>

    <section id="profile" class="profile" hidden>
      <img id="avatar" alt="Avatar GitHub">
      <h2 id="name"></h2>
      <p id="user" class="username"></p>
      <p id="bio" class="bio"></p>

      <div class="stats">
        <div class="stat"><strong id="repos">0</strong><span>Repositori Publik</span></div>
        <div class="stat"><strong id="followers">0</strong><span>Followers</span></div>
        <div class="stat"><strong id="following">0</strong><span>Following</span></div>
      </div>

      <a id="profileLink" class="profile-link" target="_blank" rel="noopener noreferrer">Lihat Profil GitHub</a>
    </section>
  </main>

  <footer>Praktikum Pemrograman Web </footer>
  <script src="script.js"></script>
</body>
</html>
